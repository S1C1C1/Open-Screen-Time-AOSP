# Robolectric runs Android code on a computer for fast tests.
# Tests run on Android 16 (API 36): Robolectric does not fully support
# Android 17 yet. Raise this once it does.
sdk=36
# Uses its native renderer so screenshots look like a real phone.
graphicsMode=NATIVE
# Use a plain Application in tests: the real one schedules background work,
# which needs WorkManager set up. Tests build what they need themselves.
application=android.app.Application
